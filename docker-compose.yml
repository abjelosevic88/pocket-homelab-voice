# Pocket Voice — voice memos written out on your own server (Go + SQLite, whisper.cpp + ffmpeg in the image). One container, one volume.
services:
  pocket-voice:
    image: ghcr.io/abjelosevic88/pocket-homelab-voice:latest
    container_name: pocket-voice
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      TZ: ${TZ:-Europe/Berlin}
      BASE_URL: ${BASE_URL:-http://localhost:8080}
      # SECURE_COOKIES: "true"          # behind HTTPS (the microphone needs HTTPS anyway)
      # First admin (only used while the database has no users):
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      NOTIFY_URL: ${NOTIFY_URL:-}
      # WHISPER_MODEL: large-v3-turbo-q5_0   # base | small | large-v3-turbo-q5_0 (downloaded into /data/models on first use)
      # STORAGE_ROOTS: /nas       # folders people may keep recordings in (mount them below)
      # WHISPER_THREADS: "4"     # dictation
      # WHISPER_BG_THREADS: "3"  # memos and meetings, at nice 19
      # Pocket Core: one sign-in, Pocket AI, and Notes/Tasks/Calendar/Money through app links.
      # CORE_URL: http://pocket-core:8080
      # CORE_REGISTRATION_KEY: ${CORE_REGISTRATION_KEY}
    volumes:
      - ./data:/data
      # - /mnt/nas/pocket-voice:/nas   # a NAS share for STORAGE_ROOTS
    extra_hosts:
      - "host.docker.internal:host-gateway"
